{% macro drawcomment(comments) %}

{% for comment in comments %}
<div class="comment">
    <div class="comment-header">
        <div class="name">
            {{comment.name}}
        </div class="name">
        <div class="date">
            {{comment.date}}
        </div>
    </div>

    <div class="comment-content">
        {% if comment.title %}
        <h2>{{comment.title}}</h2>
        {% endif %}
            {{ comment.content|safe}}
    </div>

    <div class="comment-footer">
        <div class="like">
            <a href="{{ url_for('like', id=comment.id) }}">like</a>{{comment.like}}
        </div>
        <div class="dislike">
            <a href="{{ url_for('dislike', id=comment.id) }}">dislike</a>{{comment.dislike}}
        </div>
        <div class="replay">
            <a href="{{ url_for('get_comment', id=comment.id) }}">replay</a>
        </div>

    </div>

    <div class="comment-replay">
        {{drawcomment(comment.replays)}}
    </div>
</div>
{% endfor %}

{% endmacro %}
